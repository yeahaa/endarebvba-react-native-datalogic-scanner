// Geen buildscript-blok meer: AGP en de Kotlin Gradle-plugin komen uit de
// root build.gradle van de Mendix Native Template (React Native-app).

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['DatalogicScanner_' + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties['DatalogicScanner_' + name]).toInteger()
}

android {
  namespace 'com.reactnativedatalogicscanner'

  // De Datalogic SDK-klassen (com.datalogic.decode / com.datalogic.device)
  // komen hier nog uit de lokaal geinstalleerde SDK add-on.
  compileSdkVersion 'Datalogic:Datalogic SDK v1:32'

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault('minSdkVersion')
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable 'GradleCompatible'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

repositories {
  google()
  mavenCentral()
  maven { url "https://jitpack.io" }
}

def kotlin_version = getExtOrDefault('kotlinVersion')

dependencies {
  // Versie wordt bepaald door de React Native Gradle-plugin van de app.
  implementation 'com.facebook.react:react-android'
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  implementation 'com.github.datalogic:datalogic-android-sdk-selfshopping:v1.8a'
}
